# Mapeo de archivos fuente → nodos del vault de Obsidian
# Vault: D:\Obsidian\Bovedá\proyectos\crm-universal\nodos\
# Actualizar cuando se agreguen archivos significativos a un módulo.
# Nota: todos los nodos usan patrones genéricos — actualizar cuando se cree el scaffold React.

project: crm-universal

mappings:
  # --- Dashboard ---
  - pattern: "src/modulos/dashboard/**"
    node: "dashboard"
    vault_path: "proyectos/crm-universal/nodos/dashboard.md"

  # --- Clientes ---
  - pattern: "src/modulos/clientes/**"
    node: "clientes"
    vault_path: "proyectos/crm-universal/nodos/clientes.md"

  # --- Calendario ---
  - pattern: "src/modulos/calendario/**"
    node: "calendario"
    vault_path: "proyectos/crm-universal/nodos/calendario.md"

  # --- Citas ---
  - pattern: "src/modulos/citas/**"
    node: "citas"
    vault_path: "proyectos/crm-universal/nodos/citas.md"

  # --- Productos/Servicios ---
  - pattern: "src/modulos/productos/**"
    node: "productos"
    vault_path: "proyectos/crm-universal/nodos/productos.md"

  # --- Estadísticas ---
  - pattern: "src/modulos/estadisticas/**"
    node: "estadisticas"
    vault_path: "proyectos/crm-universal/nodos/estadisticas.md"

  # --- Facturación (módulo activable) ---
  - pattern: "src/modulos/facturacion/**"
    node: "facturacion"
    vault_path: "proyectos/crm-universal/nodos/facturacion.md"

  # --- Configuración ---
  - pattern: "src/modulos/configuracion/**"
    node: "configuracion"
    vault_path: "proyectos/crm-universal/nodos/configuracion.md"

  # --- Config y feature flags ---
  - pattern: "src/config/**"
    node: "configuracion"
    vault_path: "proyectos/crm-universal/nodos/configuracion.md"

  # --- Capa de servicios ---
  - pattern: "src/services/**"
    node: "servicios"
    vault_path: "proyectos/crm-universal/nodos/servicios.md"

  # --- Componentes compartidos ---
  - pattern: "src/components/**"
    node: "componentes"
    vault_path: "proyectos/crm-universal/nodos/componentes.md"

  # --- Tipos e interfaces ---
  - pattern: "src/types/**"
    node: "tipos"
    vault_path: "proyectos/crm-universal/nodos/tipos.md"

  # --- Router ---
  - pattern: "src/router/**"
    node: "router"
    vault_path: "proyectos/crm-universal/nodos/router.md"
